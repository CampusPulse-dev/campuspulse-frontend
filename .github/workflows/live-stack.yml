name: S6 live stack
on:
  pull_request:
    branches: ['feat/S5-03-admin-portal']
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: campuspulse-frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      NEXT_PUBLIC_DEMO_MODE: 'false'
      NEXT_PUBLIC_DEV_AUTH: 'false'
      NEXT_PUBLIC_SITE_URL: http://localhost:3104
      E2E_BASE_URL: http://localhost:3104
      LIVE_API_URL: http://localhost:3001
      LIVE_E2E: 'true'
    steps:
      - uses: actions/checkout@v7
        with: { path: campuspulse-frontend }
      - name: Read exact backend dependency
        id: backend
        run: node -e "console.log('sha=' + require('./release-backend.json').ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: CampusPulse-dev/campuspulse-backend
          ref: ${{ steps.backend.outputs.sha }}
          path: campuspulse-backend
      - uses: actions/setup-node@v7
        with:
          {
            node-version: '22',
            cache: npm,
            cache-dependency-path: campuspulse-frontend/package-lock.json,
          }
      - run: npm ci
      - run: npm ci && npx prisma generate && npm run build
        working-directory: campuspulse-backend
      - run: npx tsx scripts/test-stack.ts up && npx tsx scripts/test-stack.ts migrate && npx tsx scripts/test-stack.ts browser-fixtures
        working-directory: campuspulse-backend
      - name: Start API without development header auth
        working-directory: campuspulse-backend
        run: |
          npx tsx scripts/test-stack.ts serve-live > test-results/api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3001/api/v1/health/live; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/prepare-camera.mjs
      - name: Clean production build with external font access blocked
        env:
          NODE_OPTIONS: --require=./scripts/block-font-network.cjs
        run: npm run build
      - name: Live browser journeys (60 executions)
        run: npx playwright test live.spec.ts --reporter=list,html
      - name: Warm QR timing in isolation
        if: '!cancelled()'
        run: npx vitest run src/lib/door-live.test.ts --maxWorkers=1
      - name: Start production frontend for cold Lighthouse samples
        if: '!cancelled()'
        run: |
          npm run start -- --port 3104 > test-results/frontend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3104/sign-in > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Three cold mobile samples per route
        if: '!cancelled()'
        env:
          BACKEND_SHA: ${{ steps.backend.outputs.sha }}
        run: node scripts/lighthouse-budget.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: s6-browser-performance-evidence
          path: |
            campuspulse-frontend/playwright-report/
            campuspulse-frontend/test-results/**/trace.zip
            campuspulse-frontend/test-results/**/error-context.md
            campuspulse-frontend/test-results/lighthouse/
