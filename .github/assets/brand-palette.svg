    <text x="18" y="76" fill="#FFFFFF" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700">Valid Scan / Live</text>
    <text x="18" y="98" fill="#3EE2A8" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12">#3EE2A8 · Success</text>
