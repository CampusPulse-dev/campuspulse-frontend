<svg width="1200" height="128" viewBox="0 0 1200 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Swatch 1: Deep Ink -->
  <g transform="translate(0, 0)">
    <rect width="186" height="128" rx="16" fill="#10002B" stroke="#2F1A5E" stroke-width="1.5"/>
    <text x="18" y="76" fill="#FFFFFF" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700">Deep Ink</text>
    <text x="18" y="98" fill="#B9A8D4" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12">#10002B · Dark Canvas</text>
  </g>
  <!-- Swatch 2: Purple -->
  <g transform="translate(202.8, 0)">
    <rect width="186" height="128" rx="16" fill="#5A189A"/>
    <text x="18" y="76" fill="#FFFFFF" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700">Campus Purple</text>
    <text x="18" y="98" fill="#E5D9F8" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12">#5A189A · Primary CTA</text>
  </g>
