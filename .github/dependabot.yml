version: 2

# Tuned for the launch window (to Sep 20). The goal is security patches
# without a review queue nobody has time to read. Revisit after launch:
# lift the major-version ignores and raise the limits.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      next:
        patterns: ['next', 'eslint-config-next', '@next/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      dev-tooling:
        patterns:
          - 'eslint*'
          - '@typescript-eslint/*'
          - 'prettier'
          - 'vitest'
          - '@vitejs/*'
          - '@testing-library/*'
          - '@types/*'
          - 'lint-staged'
          - 'husky'
          - '@commitlint/*'
          - 'openapi-typescript'
    ignore:
      # Majors are breaking by definition and there is no runway to absorb
      # one before launch. Security patches still come through as patch and
      # minor bumps. Remove this block after Sep 20.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      # Action bumps are low-risk and high-volume: one PR for all of them.
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
